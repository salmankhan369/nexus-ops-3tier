apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: nexus-prod
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-frontend
  template:
    metadata:
      labels:
        app: nexus-frontend
    spec:
      containers:
        - name: frontend
          image: 074609520447.dkr.ecr.ap-south-1.amazonaws.com/nexus-ops-frontend:49a827f6f484bc302317c4d18488345b35baed7d
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
