apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: nexus-prod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-backend
  template:
    metadata:
      labels:
        app: nexus-backend
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 $DB_HOST $DB_PORT; do
                echo "Waiting for AWS RDS MySQL at $DB_HOST:$DB_PORT...";
                sleep 3;
              done;
              echo "RDS MySQL is reachable!"
          envFrom:
            - configMapRef:
                name: nexus-config
      containers:
        - name: backend
          image: 074609520447.dkr.ecr.ap-south-1.amazonaws.com/nexus-ops-backend:ebbe0815d62968c35193ed7df6364fda3884b898
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-db-credentials
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
