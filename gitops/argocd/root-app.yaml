apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-ops-3tier
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/salmankhan369/nexus-ops-3tier.git
    targetRevision: main
    path: gitops/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: nexus-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true